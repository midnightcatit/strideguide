name: DB Migrate

# Normal (additive) migrations run automatically inside deploy-api.yml, before the API deploy.
# Use this workflow for: re-seeding the research KB, and any destructive/hand-reviewed migration
# you want to apply deliberately rather than as part of a normal deploy.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Also apply the research KB seed (seed-research.sql)'
        type: boolean
        default: false

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 3f513e4b8539944bdbbf5e1ff45f3af9
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply remote migrations
        run: pnpm --filter @strideguide/api run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Seed research KB
        if: ${{ inputs.seed }}
        run: pnpm --filter @strideguide/api run db:seed:research:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
