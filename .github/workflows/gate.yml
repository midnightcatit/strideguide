name: Gate

# Reusable gate: install, typecheck, test, build. Called by CI (on pushes/PRs)
# and by each deploy workflow, so a deploy can never run on a failing build.
on:
  workflow_call:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm -r --if-present run test
      - name: Build
        run: pnpm build
