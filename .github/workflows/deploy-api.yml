name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/gate.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  # false: never cancel a run mid-migration (a cancelled migration can leave partial state).
  cancel-in-progress: false

jobs:
  # Deploy is chained to the gate: it cannot run unless install/typecheck/test/build all pass.
  gate:
    uses: ./.github/workflows/gate.yml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 3f513e4b8539944bdbbf5e1ff45f3af9
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply remote migrations
        run: pnpm --filter @strideguide/api run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy API Worker
        run: pnpm --filter @strideguide/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
